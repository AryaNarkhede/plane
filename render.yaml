services:
  - type: web
    name: plane
    env: python
    region: oregon
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    plan: free
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: plane-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: plane-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: plane-media
      mountPath: /app/media
      sizeGB: 1

databases:
  - name: plane-db
    plan: free
    databaseName: plane
    user: plane

services:
  - type: redis
    name: plane-redis
    plan: free
